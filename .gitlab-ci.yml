stages:
  - install
  - test

install_dependencies:
  stage: install
  image: python:3.8
  script:
    - pip install --upgrade pip
    - pip install robotframework
    - pip install -r requirements.txt

run_tests:
  stage: test
  image: python:3.8
  script:
    - robot --outputdir results tests/
  artifacts:
    paths:
      - results/
    expire_in: 1 day
  dependencies:
    - install_dependencies
