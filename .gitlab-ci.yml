image: marketsquare/robotframework-browser
include:
  - local: /.gitlab/ci/extends.yml

stages:
  - install 🛠️
  - smoke_test 🚬
  - regression_test 📊
  - notify 🚩

install_dependencies:
  stage: install 🛠️
  extends:
    - .install:api
  script:
    - python3 --version
  artifacts:
    paths:
      - venv/
    expire_in: 1h

smoke_test:
  stage: smoke_test 🚬
  extends:
    - .robot_test_template
  variables:
    TEST_PATH: ./tests
    TEST_TAG: smoke

regression_test:
  stage: regression_test 📊
  extends:
    - .robot_test_template
  variables:
    TEST_PATH: ./tests
    TEST_TAG: regression

notify_slack_on_failure:
  stage: notify 🚩
  dependencies:
    - smoke_test
    - regression_test
  before_script:
    - |
      if [ -f failed_stage.txt ]; then
        FAILED_STAGE=$(cat failed_stage.txt)
      else
        FAILED_STAGE="unknown stage"
      fi
      TEXT="Pipeline FAILED during *$FAILED_STAGE* on project *$CI_PROJECT_NAME* (branch *$CI_COMMIT_REF_NAME*). <$CI_PIPELINE_URL|View Pipeline>"
  extends:
    - .notify:hook
  variables:
    TEXT_EMOJI: x
    EMOJI: ghost
  when: on_failure
  only:
    refs:
      - dev
      - master
      - ghada

notify_slack_on_success:
  stage: notify 🚩
  extends:
    - .notify:hook
  variables:
    TEXT_EMOJI: white_check_mark
    TEXT: Pipeline SUCCEEDED on project *$CI_PROJECT_NAME* (branch *$CI_COMMIT_REF_NAME*). <$CI_PIPELINE_URL|View Pipeline>
    EMOJI: rocket
  when: on_success
  only:
    refs:
      - dev
      - master
      - ghada

