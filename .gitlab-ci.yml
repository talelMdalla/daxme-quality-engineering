image: python:3.8
include:
  - local: /.gitlab/ci/extends.yml

stages:
  - install
  - smoke_test
  - regression_test

install_dependencies:
  stage: install
  extends:
    - .install:api
  script:
    - python3 --version

smoke_test:
  stage: smoke_test
  extends:
    - .robot_test_template
  variables:
    TEST_PATH: ./tests/auth/Login.robot
    TEST_TAG: Smoke

regression_test:
  stage: regression_test
  extends:
    - .robot_test_template
  variables:
    TEST_PATH: ./tests/auth/Login.robot
    TEST_TAG: Regression
