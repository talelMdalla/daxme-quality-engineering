.install:api:
  before_script:
    - pip install virtualenv
    - virtualenv -p python3 venv
    - source ./venv/bin/activate
    - pip install -r requirements.txt

.robot_test_template:
  script:
    - |
      if [[ "$CI_COMMIT_REF_NAME" == "master" ]]; then
        VERBOSITY="PROD"
      else
        VERBOSITY="DEV"
      fi
      robot --outputdir results -v ENV:$VERBOSITY -i $TEST_TAG $TEST_PATH
  after_script:
    - if [ "$CI_JOB_STATUS" != "success" ]; then echo $CI_JOB_STAGE > failed_stage.txt; fi
  artifacts:
    when: always
    paths:
      - results/
      - failed_stage.txt
    expire_in: 1 day
  dependencies:
    - install_dependencies
